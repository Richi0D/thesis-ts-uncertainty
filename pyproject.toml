[project]
name = "ts-uncertainty"
version = "0.1.0"
description = "This thesis investigates whether uncertainty estimates from recurrent time series foundation models, remain reliable under distribution shift."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "tzdata",
    "niquests",
    "pandas",
    "polars",
    "ipykernel<7", # kernel 7 is problematic in vscode
    "scikit-learn",
    "huggingface-hub",
    "ipywidgets",
    "matplotlib",
    "altair",
    "anywidget",
    "vl-convert-python",
    "pyarrow",
    "dysts",
    "statsforecast",
    "chronos-forecasting",
    "toto-models",
    "tirex-2",
    "timestral @ git+https://github.com/mistralai/timestral.git"
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"
